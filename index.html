<header><h1>Simulador industrial de balanceo de líneas</h1></header>

<div class="kp" id="kp"></div>
<div id="wrap"><canvas id="cv"></canvas>
<div id="ov"><label><input type="checkbox" id="rt" checked>Ruta de flujo</label><label>Velocidad cinta <input type="range" id="sp" min="0" max="3" step=".1" value="1" style="width:80px"></label><span>Arrastra para rotar · rueda para zoom</span></div>
<div id="ctl"><button id="b0">⏮</button><button id="b1">◀</button><button id="b2">▶</button><button id="bp" class="p">Construir línea</button><button id="be">⏭</button><input type="range" id="sk" min="0" value="0"><span id="nar"></span></div></div>
<div class="pn"><div class="tabs" id="tb"></div>
<div class="pg on" id="p4"></div><div class="pg" id="p0"></div><div class="pg" id="p1"></div><div class="pg" id="p2"></div><div class="pg" id="p3"></div></div>
</main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

let tasks=[],r=null,C=0,T=0,cache={},LG=[],stepK=null,pl=null,TB='sn',FILL=true,IT=300,SG=[],PB={},ops=[],pts=[],cum=[],prods=[];
$('pre').innerHTML=Object.keys(PR).map(k=>`<option value="${k}">${PR[k].n}</option>`).join('');

const nt=(id,t,p)=>({id,t,p:p?p.split(','):[],m:null,wo:null,co:null});

$('tt').addEventListener('input',e=>{const i=e.target.dataset.i;if(i==null)return;const f=e.target.dataset.f,v=e.target.value,x=tasks[i];
 if(f=='p')x.p=v.split(',').map(s=>s.trim()).filter(Boolean);else if(f=='id')x.id=v.trim();else if(f=='m')x.m=+v||null;else x.t=Math.max(0,+v||0);upd();rmi()});

$('add').onclick=()=>{tasks.push(nt(String.fromCharCode(65+tasks.length%26)+(tasks.length>25?'2':''),10,''));rt()};
$('pre').onchange=()=>load($('pre').value);
$('met').onchange=()=>{if($('met').value=='man'&&r)r.st.forEach((s,i)=>s.forEach(x=>x.m=i+1));stepK=0;rt();play()};
['D','H','ro','re','ops','mat','lay'].forEach(i=>$(i).oninput=()=>upd());
function rmi(){const m=$('met').value,tb=(hd,rows)=>`<div class="tw"><table><tr>${hd.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`,
 inp=(i,k,ph)=>`<input type="number" data-i="${i}" data-k="${k}" placeholder="${ph}" value="${tasks[i][k]??''}" style="width:70px">`;let h=`<h3>Entradas de ${MN[m]}</h3>`;

 if(m=='rpw')h+=tb(['ID','Tareas que le siguen','Peso auto','Peso a usar'],tasks.map((x,i)=>[x.id,x.sl||'—',x.wa,inp(i,'wo',x.wa)]))+'<small>Deja vacío para usar el peso calculado.</small>';
 if(m=='kw')h+=`<label><input type="checkbox" id="fl" ${FILL?'checked':''} style="width:auto"> Rellenar huecos con tareas de columnas siguientes</label>`+tb(['ID','Col. auto','Columna a usar'],tasks.map((x,i)=>[x.id,RM[x.ca-1]||x.ca,inp(i,'co',x.ca)]));
 if(m=='com')h+=`<div class="g2"><div><label>Iteraciones (se queda con la mejor)</label><input id="itx" type="number" min="1" value="${IT}"></div><div><label>&nbsp;</label><button class="p" id="rsx">Sortear de nuevo</button></div></div>`;
 if(m=='man')h+='<small>Escribe el número de estación de cada tarea en la tabla de arriba. Un número nuevo crea una estación.</small>';$('mi').innerHTML=h}
$('mi').addEventListener('input',e=>{const t=e.target,i=t.dataset.i;if(i!=null){tasks[i][t.dataset.k]=t.value===''?null:+t.value;upd()}else if(t.id=='itx'){IT=Math.max(1,+t.value||1);upd()}});
$('mi').addEventListener('change',e=>{if(e.target.id=='tbs'){TB=e.target.value;upd()}if(e.target.id=='fl'){FILL=e.target.checked;upd()}});
$('mi').addEventListener('click',e=>{if(e.target.id=='rsx'){cache={};stepK=0;upd();play()}});
function info(){const by={},ids=new Set(tasks.map(x=>x.id));tasks.forEach((x,i)=>{x.p=x.p.filter(q=>ids.has(q)&&q!=x.id);by[x.id]=x;x.col=pal[i%12]});
 const sc={};const f=id=>{if(sc[id])return sc[id];sc[id]=new Set();tasks.forEach(x=>{if(x.p.includes(id)){sc[id].add(x.id);f(x.id).forEach(y=>sc[id].add(y))}});return sc[id]};tasks.forEach(x=>f(x.id));
 const cl={},g=(x,d)=>{if(d>60)throw 0;return cl[x.id]||(cl[x.id]=1+Math.max(0,...x.p.map(q=>g(by[q],d+1))))};tasks.forEach(x=>g(x,0));
 tasks.forEach(x=>{x.sl=[...sc[x.id]].sort().join(', ');x.sn=sc[x.id].size;x.wa=x.t+[...sc[x.id]].reduce((a,b)=>a+by[b].t,0);x.ca=cl[x.id];x.w=x.wo!=null?x.wo:x.wa;x.c=x.co!=null?x.co:x.ca})}
const RU={ltt:c=>c.sort((a,b)=>b.t-a.t||(TB=='sn'?b.sn-a.sn:0)||al(a,b))[0],rpw:c=>c.sort((a,b)=>b.w-a.w||al(a,b))[0],
kw:c=>{if(!FILL){const m=Math.min(...c.map(x=>x.c));c=c.filter(x=>x.c==m)}return c.sort((a,b)=>a.c-b.c||b.t-a.t||al(a,b))[0]},com:c=>c[Math.random()*c.length|0]};
function run(rule){const done=new Set(),st=[];let cur=[],rem=C;const left=new Set(tasks.map(x=>x.id));
 while(left.size){const av=tasks.filter(x=>left.has(x.id)&&x.p.every(q=>done.has(q)));let c=av.filter(x=>x.t<=rem+1e-9);
  if(!c.length){if(cur.length){st.push(cur);cur=[];rem=C;continue}c=av}
  const k=rule(c);cur.push(k);rem-=k.t;left.delete(k.id);done.add(k.id)}
 if(cur.length)st.push(cur);return st}
function ev(st){const loads=st.map(s=>s.reduce((a,x)=>a+x.t,0)),N=st.length,h=$('H').value/60,D=+$('D').value,rate=N*(+$('ops').value*$('ro').value+ +$('re').value),lab=rate*h,tot=N*C;
 return{st,loads,N,e:T/tot,idle:tot-T,mx:Math.max(0,...loads),lab,unit:lab/D+ +$('mat').value,idleC:(tot-T)/tot*lab/D,total:lab+$('mat').value*D}}

 const D=+$('D').value,H=+$('H').value;if(!D||!H||!tasks.length)return;const key=[D,H,TB,FILL,IT,$('met').value,tasks.map(x=>x.id+x.t+x.p+x.wo+x.co+x.m).join()].join('|');if(cache.key!=key)cache={key};
 C=H*60/D;T=tasks.reduce((a,x)=>a+x.t,0);r=solve($('met').value);const nm=Math.ceil(T/C-1e-9),real=H*60/Math.max(r.mx,1e-9),hh=H/60,bi=r.loads.indexOf(r.mx),cap=Math.floor(real);
 const E=t=>'<em>'+t+'</em>';$('kp').innerHTML=[['Estaciones',r.N+E(' de '+nm+' mín.'),r.N==nm?'en el mínimo teórico':'+'+(r.N-nm)+' sobre el mínimo',2,null,'k'],['Eficiencia',f1(r.e*100)+E(' %'),'demora '+f1(100-r.e*100)+' %',2,r.e,'k'],['Ciclo C',f1(C)+E(' s'),'',1],['Tiempo total T',T+E(' s'),'',1],['Tiempo ocioso',f1(r.idle)+E(' s'),'por unidad producida',2],['Capacidad real',cap+E(' u'),'por turno · '+(cap>=D?'cumple':'no cumple'),1,null,cap>=D?'g':'r'],['Costo por unidad',E('S/ ')+f1(r.unit,2),'',1],['Costo del turno',E('S/ ')+f1(r.total,0),'mano de obra + equipo + material',2]].map(a=>`<div class="${a[5]||''}" style="grid-column:span ${a[3]}"><span>${a[0]}</span><b>${a[1]}</b>${a[2]?`<small>${a[2]}</small>`:''}${a[4]!=null?`<u><i style="width:${Math.min(100,a[4]*100)}%;background:${a[4]>=.9?'#2e9e5b':a[4]>=.75?'#e0a100':'#d33'}"></i></u>`:''}</div>`).join('');
 pages(nm,D);replay();b3();sync()}
function pages(nm,D){const n=r.N,W=620,bw=Math.min(70,480/n),mx=Math.max(C,r.mx)*1.12,y=v=>230-v/mx*210,sw=540/n;let s=`<svg viewBox="0 0 ${W} 262"><text x="4" y="14" font-size="11">Yamazumi: carga por estación (s)</text>`;
 r.st.forEach((S,i)=>{let a=0;const x=55+i*sw+(sw-bw)/2;S.forEach(k=>{s+=`<rect x="${x}" y="${y(a+k.t)}" width="${bw}" height="${Math.max(0,y(a)-y(a+k.t))}" fill="${k.col}" stroke="#0004"/><text x="${x+bw/2}" y="${(y(a)+y(a+k.t))/2+4}" text-anchor="middle" font-size="11" style="fill:#fff">${k.id}</text>`;a+=k.t});s+=`<text x="${x+bw/2}" y="248" text-anchor="middle" font-size="12">E${i+1} · ${f1(r.loads[i]/C*100,0)}%</text>`});

 const cols={};tasks.forEach(x=>(cols[x.c]=cols[x.c]||[]).push(x));const mc=Math.max(...Object.keys(cols)),mr=Math.max(...Object.values(cols).map(a=>a.length)),pos={},sOf={};r.st.forEach((S,i)=>S.forEach(x=>sOf[x.id]=i));

 tasks.forEach(x=>x.p.forEach(q=>{const a=pos[q],b=pos[x.id],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);d+=`<line x1="${a[0]+dx/L*20}" y1="${a[1]+dy/L*20}" x2="${b[0]-dx/L*22}" y2="${b[1]-dy/L*22}" stroke="#888" marker-end="url(#ar)"/>`}));
 tasks.forEach(x=>{const p=pos[x.id];d+=`<circle cx="${p[0]}" cy="${p[1]}" r="20" fill="${pal[sOf[x.id]%12]}"/><text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-weight="700" style="fill:#fff">${x.id}</text><text x="${p[0]}" y="${p[1]+33}" text-anchor="middle" font-size="10">${x.t}s</text>`});
